<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diorama Bar Scheduler 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>Diorama Bar Scheduler 2026</h1>
    </header>

    <section class="controls">
      <div class="control-card">
        <h2>Actions</h2>
        <button id="btn-clear-schedule">Clear schedule</button>
        <button id="btn-auto-allocate">Auto allocate</button>
        <button id="btn-people-view">People view</button>
        <button id="btn-save-schedule">Save schedule JSON</button>
        <div id="alert" class="alert"></div>
      </div>
    </section>

    <section class="layout">
      <section class="schedule-panel">
        <div class="panel">
          <h2>Schedule</h2>
          <div id="schedule-grid"></div>
        </div>
        <div class="panel summary-panel">
          <h2>Summary</h2>
          <div id="summary"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
</body>
</html>
