<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diorama Bar Scheduler 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>Diorama Bar Scheduler 2026</h1>
      <button id="btn-admin-toggle" class="admin-toggle-btn">Admin</button>
    </header>

    <div id="admin-modal" class="admin-modal-overlay" style="display:none">
      <div class="admin-modal-card">
        <div class="admin-modal-title">Enter admin code</div>
        <input type="password" id="admin-code-input" class="admin-code-input"
               maxlength="6" placeholder="······" inputmode="numeric" autocomplete="off" />
        <div id="admin-code-error" class="admin-code-error"></div>
        <div class="admin-modal-actions">
          <button id="btn-admin-cancel">Cancel</button>
          <button id="btn-admin-confirm">Confirm</button>
        </div>
      </div>
    </div>

    <section class="controls">
      <div class="control-card">
        <h2>Actions</h2>
        <button id="btn-clear-schedule">Clear schedule</button>
        <button id="btn-auto-allocate">Auto allocate</button>
        <button id="btn-save-schedule">Save schedule JSON</button>
        <button id="btn-import-schedule">Import schedule JSON</button>
        <input type="file" id="input-import-file" accept=".json" style="display:none" />
        <div id="alert" class="alert"></div>
      </div>
    </section>

    <div class="compact-summary-panel">
      <div id="summary" class="compact-summary"></div>
    </div>

    <div class="view-tabs">
      <button id="btn-schedule-view" class="tab-button active">Schedule</button>
      <button id="btn-people-view" class="tab-button">People</button>
      <button id="btn-tab-calendar" class="tab-button">Calendar</button>
    </div>
    <div id="program-filters" class="program-filters"></div>

    <section class="layout">
      <section class="schedule-panel">
        <div class="panel">
          <div id="schedule-grid"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
</body>
</html>
